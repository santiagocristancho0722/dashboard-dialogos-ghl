<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Revisión Mensual de Diálogos del Chatbot</title>
<style>
:root{--bg:#f3f6fa;--card:#ffffff;--ink:#0f2438;--muted:#53677c;--line:#d3dde8;--accent:#023859;--accent-ink:#ffffff;--bad:#9c0006;--focus:#2a5e95}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1722;--card:#12253a;--ink:#e6eef7;--muted:#9db2c7;--line:#27415c;--accent:#6399ba;--accent-ink:#06121d;--bad:#ff9aa0;--focus:#8fbbe0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1722;--card:#12253a;--ink:#e6eef7;--muted:#9db2c7;--line:#27415c;--accent:#6399ba;--accent-ink:#06121d;--bad:#ff9aa0;--focus:#8fbbe0;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px 24px}
h1{margin:0 0 6px;font-size:1.2rem;line-height:1.25;text-wrap:balance;font-weight:700}
p{margin:0 0 18px;color:var(--muted)}
label{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;font-weight:600;color:var(--accent-ink);background:var(--accent);border:0;border-radius:6px;padding:10px 16px;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
#msg{min-height:1.4em;margin:12px 0 0;font-size:.88rem;color:var(--bad)}
</style></head><body>
<main>
<h1>Revisión Mensual de Diálogos del Chatbot</h1>
<p>Ingresa el PIN de acceso para ver el dashboard.</p>
<form id="f" autocomplete="off">
<label for="pin">PIN de acceso</label>
<div class="row"><input id="pin" type="password" autocomplete="off" autofocus><button id="go" type="submit">Entrar</button></div>
<div id="msg" role="alert"></div>
</form>
</main>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const wait=()=>new Promise(r=>setTimeout(r,30));
async function viaSubtle(pin,salt,iv,ct){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pin),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct));
}
async function viaForge(pin,salt,iv,ct){
  if(!window.forge) throw new Error("No se pudo cargar la librería de cifrado");
  await wait();
  const bin=u=>{let r='';for(let i=0;i<u.length;i+=8192)r+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return r};
  const key=forge.pkcs5.pbkdf2(forge.util.encodeUtf8(pin),bin(salt),ITER,32,forge.md.sha256.create());
  const d=forge.cipher.createDecipher("AES-GCM",key);
  d.start({iv:bin(iv),tag:forge.util.createBuffer(bin(ct.slice(ct.length-16)))});
  d.update(forge.util.createBuffer(bin(ct.slice(0,ct.length-16))));
  if(!d.finish()){const e=new Error("bad");e.name="OperationError";throw e}
  return forge.util.decodeUtf8(d.output.getBytes());
}
async function open_(pin){
  const raw=b64(BLOB), salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  if(window.crypto&&crypto.subtle) return viaSubtle(pin,salt,iv,ct);
  return viaForge(pin,salt,iv,ct);
}
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const go=document.getElementById("go"), msg=document.getElementById("msg"), pin=document.getElementById("pin").value;
  if(!pin){msg.textContent="Escribe el PIN.";return}
  go.disabled=true;msg.style.color="var(--muted)";msg.textContent="Verificando…";
  await wait();
  try{
    const html=await open_(pin);
    document.open();document.write(html);document.close();
  }catch(err){
    go.disabled=false;msg.style.color="var(--bad)";
    msg.textContent=(err&&err.name==="OperationError")?"PIN incorrecto.":"No se pudo abrir: "+(err&&err.message||err);
  }
});
